server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_URL:http://user-service:8080}
              predicates:
                - Path=/api/v1/users/**, /api/v1/sellers/**, /api/v1/auth/**
              filters:
                - name: JwtAuthFilter

            - id: product-service
              uri: ${USER_URL:http://product-service:8080}
              predicates:
                - Path=/api/v1/products/**, /api/v1/stocks/**, /api/v1/internal/stocks/**, /api/v1/time-deals/**, /api/v1/internal/time-deals/**
              filters:
                - name: JwtAuthFilter

            - id: order-service
              uri: ${USER_URL:http://order-service:8080}
              predicates:
                - Path=/api/v1/carts/**, /api/v1/orders/**, /api/v1/payments/**, /api/v1/internal/payments/**, /api/v1/deliveries/**, /api/v1/order-items/**, /api/v1/refunds/**, /api/v1/settlements/**, /api/v1/notification-subscriptions/**, /api/v1/notifications/**
              filters:
                - name: JwtAuthFilter

jwt:
  secret: ${JWT_SECRET:v3ry-s3cr3t-k3y-f0r-p4rut-ms4-jwt-t0k3n-s3cur1ty!@#must-be-long-enough}