spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:user-service/.env[.properties]"

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:parut}
    username: ${POSTGRES_USER:parut}
    password: ${POSTGRES_PASSWORD:parut123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${USER_POSTGRES_SCHEMA:user_schema}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    baseline-on-migrate: true # 기존 DB 구조를 기준점으로 삼아버리고 마이그레이션을 이어나가게 해줌
    baseline-version: "4"  # 현재 DB 상태를 V4가 모두 완료된 상태로 간주함
    enabled: true
    locations: classpath:db/migration, classpath:db/migration/dev
    schemas: user_schema
    default-schema: user_schema


management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

feign:
  client:
    config:
      default:
        connectTimeout: 3000 # 타임아웃 3초 (MS)
        readTimeout: 5000    # 응답 대기 5초 (MS)
        loggerLevel: BASIC   # 요청/응답 요약 로그

logging:
  level:
    com.parut.user: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace


jwt:
  secret: ${JWT_SECRET:v3ry-s3cr3t-k3y-f0r-p4rut-ms4-jwt-t0k3n-s3cur1ty!@#must-be-long-enough}
  access-token-expire: ${JWT_ACCESS_TOKEN_EXPIRE:30m}
  refresh-token-expire: ${JWT_REFRESH_TOKEN_EXPIRE:8h}

internal:
  service-key: ${INTERNAL_SERVICE_KEY:local-dev-key}