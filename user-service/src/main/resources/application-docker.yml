spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:user_schema}

  flyway:
    baseline-on-migrate: true # 기존 DB 구조를 기준점으로 삼아버리고 마이그레이션을 이어나가게 해줌
    baseline-version: "4"  # 현재 DB 상태를 V4가 모두 완료된 상태로 간주함
    enabled: true
    locations: classpath:db/migration, classpath:db/migration/dev
    schemas: user_schema
    default-schema: user_schema

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true


logging:
  level:
    com.parut.user: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace