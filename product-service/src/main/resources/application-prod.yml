server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${PRODUCT_POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: product_schema

  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration
    schemas: product_schema
    default-schema: product_schema

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
    com.parut.product: info
    org.hibernate.SQL: info

parut:
  product-stock:
    scheduler-rate: ${PRODUCT_STOCK_RATE:10m}
    reservation-ttl: ${PRODUCT_STOCK_RESERVATION_TTL:30m}
