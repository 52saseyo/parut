spring:
  application:
    name: product
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


logging:
  level:
    root: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [traceId=%X{traceId}] %-5level %logger - %msg%n"


internal:
  service-key: ${INTERNAL_SERVICE_KEY:local-dev-key}

parut:
  time-deal:
    sale-period-interval: ${TIME_DEAL_SALE_PERIOD_INTERVAL:1m}


cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET}
      base-url: ${S3_BASE_URL}
      presigned-expiration-seconds: ${IMAGE_PRESIGNED_EXPIRATION_SECONDS:600}
