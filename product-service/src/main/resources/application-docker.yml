spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:product_schema}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: product_schema
    default-schema: product_schema

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true


logging:
  level:
    com.parut.product: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}