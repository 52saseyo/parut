services:
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-service
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker

      POSTGRES_URL: jdbc:postgresql://postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
      EUREKA_URI: ${EUREKA_URI} # 추후 인프라 구조에 따라 변경 혹은 지워질수도 있음

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - product-network

  postgres:
    image: postgres:17-alpine
    container_name: product-postgres
    environment:
      POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:${POSTGRES_PORT}"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - product-network


volumes:
  product_postgres_data:

networks:
  product-network:
    driver: bridge