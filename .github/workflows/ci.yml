name: CI

# develop 또는 main 대상 PR 생성 및 업데이트 시 실행
on:
  pull_request:
    branches:
      - develop
      - main

# 저장소와 PR 변경 파일을 읽기 위한 최소 권한
permissions:
  contents: read
  pull-requests: read

# 같은 PR/브랜치에 새 커밋이 올라오면 이전 CI 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 변경된 서비스 목록 확인
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    # 변경된 서비스 목록을 다음 Job에 전달
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v6
      # 파일 경로를 기준으로 변경된 서비스 판별
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            user-service:
              - 'user-service/**'
              - '.github/workflows/ci.yml'
            order-service:
              - 'order-service/**'
              - '.github/workflows/ci.yml'
            notification-service:
              - 'notification-service/**'
              - '.github/workflows/ci.yml'
            product-service:
              - 'product-service/**'
              - '.github/workflows/ci.yml'

  # 변경된 서비스만 빌드하고 테스트
  build-and-test:
    name: Build & Test - ${{ matrix.service }}
    needs: detect-changes
    # 변경된 서비스가 없으면 Job 실행하지 않음
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest

    # PostgreSQL 통합 테스트가 필요한 서비스에서 사용할 공통 DB 인프라
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parut_test
          POSTGRES_USER: parut
          POSTGRES_PASSWORD: parut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parut -d parut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI PostgreSQL 접속 정보만 제공하며 JPA, Flyway, Eureka 정책은 각 서비스에서 관리
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/parut_test
      SPRING_DATASOURCE_USERNAME: parut
      SPRING_DATASOURCE_PASSWORD: parut_test

    strategy:
      # 한 서비스가 실패해도 다른 서비스 검사는 계속 실행
      fail-fast: false
      # 변경된 서비스마다 독립적인 Job 생성
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v6

      # Java 21 설치 및 Gradle 캐시 설정
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.service }}/build.gradle
            ${{ matrix.service }}/settings.gradle
            ${{ matrix.service }}/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission
        run: chmod +x ${{ matrix.service }}/gradlew

      # 변경 서비스의 컴파일, 테스트, 검증, 패키징 실행
      - name: Build and test
        run: >-
          ./${{ matrix.service }}/gradlew
          -p ${{ matrix.service }}
          clean build
          --no-daemon
          --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/test
          if-no-files-found: ignore

  # 서비스별 Matrix 검사 결과를 하나의 고정된 머지 기준으로 통합
  ci-result:
    name: CI Result
    needs:
      - detect-changes
      - build-and-test
    # 앞선 Job이 실패하거나 생략되어도 최종 결과를 항상 판정
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check CI result
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          # 변경 서비스 감지에 실패하면 최종 CI도 실패 처리
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Failed to detect changed services."
            exit 1
          fi

          # 서비스 검사가 실패 또는 취소되면 최종 CI도 실패 처리
          # 서비스 변경이 없어 build-and-test가 생략된 경우는 정상으로 처리
          if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != "skipped" ]; then
            echo "One or more service builds or tests failed."
            exit 1
          fi

          # 변경된 모든 서비스의 검사가 정상적으로 완료됨
          echo "All CI checks passed."
