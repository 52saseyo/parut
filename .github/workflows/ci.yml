name: CI

# develop 또는 main 대상 PR과 push에서 실행
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

# 저장소와 PR 변경 파일을 읽기 위한 최소 권한
permissions:
  contents: read
  pull-requests: read

# 같은 PR/브랜치에 새 커밋이 올라오면 이전 CI 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 변경된 서비스 목록 확인
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    # 변경된 서비스 목록을 다음 Job에 전달
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
      # 파일 경로를 기준으로 변경된 서비스 판별
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user-service:
              - 'user-service/**'
              - '.github/workflows/ci.yml'
            order-service:
              - 'order-service/**'
              - '.github/workflows/ci.yml'
            notification-service:
              - 'notification-service/**'
              - '.github/workflows/ci.yml'
            product-service:
              - 'product-service/**'
              - '.github/workflows/ci.yml'

  # 변경된 서비스만 빌드하고 테스트
  build-and-test:
    name: Build & Test - ${{ matrix.service }}
    needs: detect-changes
    # 변경된 서비스가 없으면 Job 실행하지 않음
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # 한 서비스가 실패해도 다른 서비스 검사는 계속 실행
      fail-fast: false
      # 변경된 서비스마다 독립적인 Job 생성
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
      # Java 21 설치 및 Gradle 캐시 설정
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.service }}/build.gradle
            ${{ matrix.service }}/settings.gradle
            ${{ matrix.service }}/gradle/wrapper/gradle-wrapper.properties
      - name: Grant execute permission
        run: chmod +x ${{ matrix.service }}/gradlew

      # 변경 서비스의 컴파일, 단위 테스트, 통합 테스트, 패키징 실행
      - name: Build and test
        run: >-
          ./${{ matrix.service }}/gradlew
          -p ${{ matrix.service }}
          clean build
          --no-daemon
          --stacktrace

      # 실패한 경우 테스트 결과를 Artifact로 업로드
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/test
          if-no-files-found: ignore
