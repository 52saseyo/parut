name: CI

# develop 또는 main 대상 PR과 push에서 실행
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

# 저장소와 PR 변경 파일을 읽기 위한 최소 권한
permissions:
  contents: read
  pull-requests: read

# 같은 PR/브랜치에 새 커밋이 올라오면 이전 CI 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 변경된 서비스 목록 확인
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    # 변경된 서비스 목록을 다음 Job에 전달
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v6
      # 파일 경로를 기준으로 변경된 서비스 판별
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            user-service:
              - 'user-service/**'
              - '.github/workflows/ci.yml'
            order-service:
              - 'order-service/**'
              - '.github/workflows/ci.yml'
            notification-service:
              - 'notification-service/**'
              - '.github/workflows/ci.yml'
            product-service:
              - 'product-service/**'
              - '.github/workflows/ci.yml'

  # 변경된 서비스만 빌드하고 테스트
  build-and-test:
    name: Build & Test - ${{ matrix.service }}
    needs: detect-changes
    # 변경된 서비스가 없으면 Job 실행하지 않음
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest

    # PostgreSQL 통합 테스트가 필요한 서비스에서 사용할 공통 DB 인프라
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parut_test
          POSTGRES_USER: parut
          POSTGRES_PASSWORD: parut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parut -d parut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # 서비스별 테스트 설정이 준비되기 전까지 CI에서 공통으로 적용
    # 추후 각 서비스가 Flyway와 Eureka 테스트 설정을 직접 관리하면 이 설정을 제거
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/parut_test
      SPRING_DATASOURCE_USERNAME: parut
      SPRING_DATASOURCE_PASSWORD: parut_test
      # Flyway 대신 Hibernate가 테스트용 테이블을 생성하고 테스트 종료 시 제거
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      # 서비스별 Flyway 구성이 완료되기 전까지 CI에서는 마이그레이션 실행을 비활성화
      SPRING_FLYWAY_ENABLED: "false"
      # CI에는 Eureka Server가 없으므로 Eureka Client 실행, 서비스 등록 및 Registry 조회를 비활성화
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"

    strategy:
      # 한 서비스가 실패해도 다른 서비스 검사는 계속 실행
      fail-fast: false
      # 변경된 서비스마다 독립적인 Job 생성
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v6

      # Java 21 설치 및 Gradle 캐시 설정
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.service }}/build.gradle
            ${{ matrix.service }}/settings.gradle
            ${{ matrix.service }}/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission
        run: chmod +x ${{ matrix.service }}/gradlew

      # 변경 서비스의 컴파일, 테스트, 검증, 패키징 실행
      - name: Build and test
        run: >-
          ./${{ matrix.service }}/gradlew
          -p ${{ matrix.service }}
          clean build
          --no-daemon
          --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/test
          if-no-files-found: ignore
