spring:
  application:
    name: order
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
    open-in-view: false

# Product의 internal.service-key와 동일 네이밍, 팀 공식 컨벤션은 아직 아님
internal:
  service-key: ${INTERNAL_SERVICE_KEY:temp-secret-key}

logging:
  level:
    root: info
