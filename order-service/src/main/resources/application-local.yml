spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:parut}
    username: ${POSTGRES_USER:parut}
    password: ${POSTGRES_PASSWORD:parut123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: order_schema

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: order_schema
    default-schema: order_schema

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

logging:
  level:
    com.parut.order: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 로컬 검증에서 배송 상태 전이를 빠르게 확인하기 위한 설정이며 운영 기본값은 변경하지 않는다.
delivery:
  completion:
    delay-seconds: 10
    fixed-delay: 1s
